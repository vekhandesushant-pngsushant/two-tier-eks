<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2-Tier App on EKS</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}
 input{padding:8px;width:70%} button{padding:8px 12px;cursor:pointer}
 li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ddd}
 small{color:#666}
</style></head>
<body>
<h2>Task Manager (Node.js + MySQL on EKS)</h2>
<small id="info"></small>
<p><input id="t" placeholder="New task / नवीन काम"> <button onclick="add()">Add</button></p>
<ul id="list"></ul>
<script>
async function load(){
  const r=await fetch('/api/tasks'); const d=await r.json();
  list.innerHTML=d.map(x=>`<li><span></span><button data-id="${x.id}" onclick="del(${x.id})">x</button></li>`).join('');
  [...list.children].forEach((li,i)=>li.firstChild.textContent=d[i].title);
  const i=await (await fetch('/api/info')).json(); info.textContent=`Served by pod: ${i.pod} | version: ${i.version}`;
}
async function add(){
  if(!t.value.trim())return;
  await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t.value})});
  t.value=''; load();
}
async function del(id){ await fetch('/api/tasks/'+id,{method:'DELETE'}); load(); }
load();
</script></body></html>
